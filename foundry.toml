[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = "0.8.20"
evm_version = 'paris'
via_ir = true
optimizer = true
optimizer_runs = 1000

fs_permissions = [{ access = "read", path = "./"}]

dynamic_test_linking = true

[fuzz]
runs = 1024

[rpc_endpoints]
bsc_testnet = "https://bsc-testnet.infura.io/v3/402b910bd7e24d2a866ac48ab3741e75"
bsc = "https://bsc-mainnet.infura.io/v3/402b910bd7e24d2a866ac48ab3741e75"

[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=56" }
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=97" }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config