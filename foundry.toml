[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
dynamic_test_linking = true

# Gas configuration
gas_limit = 30000000
block_gas_limit = 30000000

# File system permissions
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./out" },
    { access = "read-write", path = "./cache" },
]

# Gas reporting
gas_reports = ["*"]

# Fuzz testing configuration
[fuzz]
runs = 256
max_test_rejects = 65536
timeout = 10

# Invariant testing configuration
[invariant]
runs = 256
depth = 15
fail_on_revert = false
timeout = 10

# RPC endpoints
[rpc_endpoints]
bsc_mainnet = "${BSC_RPC_MAINNET_URL}"
bsc_testnet = "${BSC_RPC_TESTNET_URL}"
# 备用 RPC 端点（如果环境变量未设置）
bsc = "https://bsc-dataseed.bnbchain.org"
bsc_testnet_backup = "https://bsc-testnet-rpc.publicnode.com"
mainnet = "https://eth-mainnet.alchemyapi.io/v2/${ALCHEMY_API_KEY}"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

# Etherscan configuration for contract verification
[etherscan]
bsc = { key = "${ETHERSCAN_API_KEY}", url = "https://api.bscscan.com/api", chain = 56 }
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api", chain = 97 }
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
